# Dataset registry for mononet benchmarks (honest-scholar `dataset` capability).
# Written by research-init (adopt) from benchmarks/datasets/{sources.py,manifest.toml}
# with real SHA-256 fixity over the committed (Git LFS) blobs.
#
# PROPOSED — tier / license / redistributable / sensitivity are MATERIAL
# classifications awaiting the author's sign-off (agency principle).
#
# NOT YET REGISTERED: the 5 CMNN paper-reproduction datasets (auto, heart, compas,
# blog, loan) are fetched at runtime (Zenodo 7968969, CC-BY-4.0) and not committed,
# so no local bytes exist to hash. Registering them with real fixity is a tracked
# follow-up — do it via `honest-scholar dataset fetch` + `verify`, not by hand.
#
# Tiers: A = redistributable + committed in-repo (Git LFS under benchmarks/data/);
#        B = fetchable from a canonical public source URL;
#        C = manual acquisition (instructions only).

version: 1

