name: Build

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:

  static-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Install dependencies
        run: uv pip install --system -e ".[all-cpu]" --group=dev --group=lint
      - name: Run static analysis
        run: ./tools/static-analysis.sh

  pre-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Install dependencies
        run: uv pip install --system -e ".[all-cpu]" --group=dev --group=lint
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ hashFiles('.pre-commit-config.yaml') }}
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --hook-stage manual --all-files

  docs-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Install dependencies
        run: uv pip install --system -e ".[all-cpu]" --group=docs
      - name: Build docs (strict)
        run: ./tools/build-docs.sh

  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        backend: [torch, jax, keras]
        include:
          - { os: ubuntu-latest,  backend: torch, extra: torch-cpu }
          - { os: macos-latest,   python-version: "3.14", backend: torch }
          - { os: macos-latest,   python-version: "3.14", backend: jax }
          - { os: macos-latest,   python-version: "3.14", backend: keras }
          - { os: windows-latest, python-version: "3.14", backend: torch }
          - { os: windows-latest, python-version: "3.14", backend: jax }
          - { os: windows-latest, python-version: "3.14", backend: keras }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Install dependencies
        run: uv pip install --system -e ".[${{ matrix.extra || matrix.backend }}]" --group=dev --group=bench
      - name: Run tests
        env:
          MONONET_TEST_BACKEND: ${{ matrix.backend }}
          KERAS_BACKEND: jax
        run: pytest tests/core "tests/${{ matrix.backend }}" tests/equivalence tests/benchmarks tests/test_top_level_imports.py --no-cov -v

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Install dependencies
        run: uv pip install --system -e ".[all-cpu]" --group=dev
      - name: Run combined-backend coverage
        env:
          KERAS_BACKEND: jax
        run: |
          coverage erase
          MONONET_TEST_BACKEND=torch pytest tests/core tests/torch tests/equivalence tests/examples tests/test_top_level_imports.py
          MONONET_TEST_BACKEND=jax   pytest tests/jax   tests/equivalence
          MONONET_TEST_BACKEND=keras pytest tests/keras tests/equivalence tests/legacy
          coverage report --show-missing --fail-under=100
          coverage xml
      # Advisory only: skipped on fork PRs (no token). The hard --fail-under=100
      # gate above is the real, token-independent enforcement. See PR description.
      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true

  check:
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    needs: [static-analysis, pre-commit, docs-smoke, test, coverage]
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1 # nosemgrep
        with:
          jobs: ${{ toJSON(needs) }}
